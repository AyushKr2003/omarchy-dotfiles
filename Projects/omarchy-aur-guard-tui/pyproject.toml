[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aur-guard-tui"
version = "3.0.0"
description = "AUR security scanner TUI for Arch Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "AyushKr2003" }
]
keywords = ["archlinux", "aur", "security", "tui", "textual", "pkgbuild"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Console :: Curses",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "textual>=0.50.0",
  "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/AyushKr2003/omarchy-dotfiles"
Documentation = "https://github.com/AyushKr2003/omarchy-dotfiles/tree/main/Projects/omarchy-aur-guard-tui/docs"

[project.scripts]
aur-guard = "aur_guard.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aur_guard*"]

[tool.setuptools]
include-package-data = true
