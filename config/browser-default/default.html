<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>~/startpage</title>
    <link rel="stylesheet" type="text/css" href="colors.css">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left-container">
            <div class="gif">
                <img src="cat.gif" alt="Cat illustration">
            </div>
        </div>

        <div class="right-container">
            <div class="head">
                <div class="terminal-prompt" id="terminal-prompt">
                    <span class="prompt-symbol">&gt;</span>
                    <span class="prompt-cmd">cd</span>
                    <span class="prompt-path" id="prompt-path">~/</span>
                    <span class="prompt-input-area" id="prompt-input-area">
                        <span id="prompt-typed" class="prompt-typed"></span>
                        <span id="prompt-ghost" class="prompt-ghost"></span>
                        <span id="terminal-cursor" class="terminal-cursor blinking">_</span>
                        <input
                            type="text"
                            id="terminal-input"
                            class="terminal-real-input"
                            autocomplete="off"
                            autocorrect="off"
                            autocapitalize="off"
                            spellcheck="false"
                            aria-label="Fish shell prompt"
                            autofocus
                        />
                    </span>
                </div>
            </div>

            <!-- Default Bookmarks Section (visible at rest) -->
            <div class="bookmarks" id="bookmarks-section">
                <div class="category">
                    <ul class="links">
                        <li class="title">work</li>
                        <li><a href="https://gmail.com">gmail</a></li>
                        <li><a href="https://outlook.office.com">outlook</a></li>
                        <li><a href="https://linkedin.com">linkedin</a></li>
                        <li><a href="https://vim.rtorr.com/">vim</a></li>
                    </ul>
                </div>

                <div class="category">
                    <ul class="links">
                        <li class="title">dev</li>
                        <li><a href="https://github.com/">github</a></li>
                        <li><a href="https://lobste.rs/">lobste.rs</a></li>
                        <li><a href="https://mankier.com/">mankier</a></li>
                        <li><a href="https://devdocs.io/">devdocs</a></li>
                    </ul>
                </div>

                <div class="category">
                    <ul class="links">
                        <li class="title"><a href="https://reddit.com">reddit</a></li>
                        <li><a href="https://reddit.com/r/programming/">programming</a></li>
                        <li><a href="https://reddit.com/r/selfhosted/">selfhosted</a></li>
                        <li><a href="https://reddit.com/r/unixporn/">unixporn</a></li>
                        <li><a href="https://reddit.com/r/mechanicalkeyboards/">mk</a></li>
                    </ul>
                </div>

                <div class="category">
                    <ul class="links">
                        <li class="title">play</li>
                        <li><a href="https://monkeytype.com/">monkeytype</a></li>
                        <li><a href="https://youtube.com/">youtube</a></li>
                        <li><a href="https://twitch.tv/">twitch</a></li>
                        <li><a href="https://netflix.com/">netflix</a></li>
                    </ul>
                </div>
            </div>

            <!-- Terminal Buffer (Direct terminal output and completions, NO CARDS) -->
            <div class="terminal-view" id="terminal-view" style="display: none;">
                <div class="terminal-output" id="terminal-output" style="display: none;"></div>
                <div class="terminal-completions" id="terminal-completions">
                    <ul class="completions-list" id="completions-list" role="listbox"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
